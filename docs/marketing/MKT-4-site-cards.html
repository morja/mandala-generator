<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MKT-4 site cards</title>
<style>
:root {
  --bg: #0a0908; --fg: #f4efe6; --muted: #b9b2a6; --accent: #e3b071;
  --frame: #1f1c18; --frame-edge: #3b362e; --shadow: 0 30px 80px rgba(0,0,0,.6);
  --font: "Inter", "Inter Variable", system-ui, sans-serif; --gutter: 72px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
body { width: 1080px; height: 1350px; overflow: hidden; position: relative; }
.text { position: absolute; left: var(--gutter); right: var(--gutter); top: 84px; }
.title { font-size: 96px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.title small { display: block; font-size: .46em; font-weight: 500; letter-spacing: -0.01em; margin-top: .22em; color: var(--muted); }
.message { font-size: 42px; font-weight: 400; line-height: 1.3; margin: 36px 0 0; text-wrap: pretty; }
.link { font-size: 40px; color: var(--accent); font-weight: 500; margin: 22px 0 0; }
.browser { position: absolute; left: var(--gutter); top: 620px; width: 820px; background: var(--frame); border: 4px solid var(--frame-edge); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.browser .bar { height: 40px; background: var(--frame-edge); display: flex; align-items: center; gap: 10px; padding: 0 18px; }
.browser .bar i { width: 13px; height: 13px; border-radius: 50%; background: #6b645a; display: block; }
.browser img { display: block; width: 100%; }
.phone { position: absolute; right: 48px; top: 700px; width: 270px; background: var(--frame); border: 4px solid var(--frame-edge); border-radius: 44px; padding: 12px; box-shadow: var(--shadow); }
.phone img { display: block; width: 100%; border-radius: 30px; }
</style>
</head>
<body>
<script>
const CARDS = {
  meera: { title: "Mother Meera", sub: "Booking, redesigned", message: "The booking site for darshans and meditations got a new design.", link: "booking.mothermeera.com", desktop: "sites/meera-desktop.jpg", mobile: "sites/meera-mobile.jpg" },
  advaita: { title: "Advaita Hub", sub: "Now online", message: "An independent, bilingual catalogue of teachers of non-dual paths.", link: "advaitahub.org", desktop: "sites/advaita-desktop.jpg", mobile: "sites/advaita-mobile.jpg" }
};
const c = CARDS[new URLSearchParams(location.search).get("c")] || CARDS.meera;
document.body.innerHTML = `
  <div class="text"><h1 class="title">${c.title}<small>${c.sub}</small></h1><p class="message">${c.message}</p><p class="link">${c.link}</p></div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="${c.desktop}" alt=""></div>
  <div class="phone"><img src="${c.mobile}" alt=""></div>`;
</script>
</body>
</html>
