# Dahlia for iPhone (PLAN-4). The Xcode project is generated from this file and not committed:
#   ios/Dahlia/scripts/generate     (or: xcodegen generate --spec ios/Dahlia/project.yml)
# Signing: copy Config/Signing.example.xcconfig to Config/Signing.xcconfig (ignored by Git).
name: Dahlia
options:
  bundleIdPrefix: one.tearoom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, de, es, fr, it, pt-BR, ru, ja, ko, zh-Hans]
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dahlia:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Shared with the widget extension: the App Group, the widget index and the configuration intent (WP-10).
      - path: Shared
      - path: Resources
        excludes:
          - "*.md"
      - path: ../../android/app/src/main/assets/starter-favorites.json
        buildPhase: resources
      # The licence text of the libraries, shown in About (the same file as on Android).
      - path: ../../android/app/src/main/assets/licenses/apache-2.0.txt
        buildPhase: resources
      # The local StoreKit configuration (WP-9): in the project for the scheme's Run action, not in the app.
      - path: Config/Dahlia.storekit
        buildPhase: none
    dependencies:
      # The Kotlin core, always the release (optimised) framework (SPIKE-3); built by scripts/build-core.
      - framework: ../build/MandalaCore.xcframework
        embed: false
      # "Mandala of the day" (WP-10), embedded in the app's PlugIns folder.
      - target: DahliaWidget
    preBuildScripts:
      - name: Build the Kotlin core
        script: '"$SRCROOT/scripts/build-core"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Keys without a build setting (the background task identifiers), merged into the generated plist.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait on the iPhone, like Android's phone layout; the iPad key only satisfies Xcode's check.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: $(DAHLIA_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Dahlia adds the pictures you save to your photo library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DAHLIA_APP_ICON)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
        # The App Group (approval A2, group.<bundle id> from the xcconfig) for the Pro flag and the widget. Simulator
        # builds only: a device build needs the group on the App IDs, which Xcode adds once an account is signed in
        # (IOS-9, IOS-10). Then this line and the widget's lose their [sdk=…] condition. Without it `AppGroup.container` is nil.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Dahlia.entitlements
  # The home screen widget "Mandala of the day" (WP-10, ADR-0020 amended for the iPhone). Never links MandalaCore: an
  # extension may use about 30 MB, so it only shows the pictures the app rendered into the App Group.
  DahliaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Sources/Theme/Tokens.swift
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DAHLIA_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: $(DAHLIA_DISPLAY_NAME)
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Widget.entitlements
  # Parity test (PLAN-4 section 3.11): renders the fixtures through the framework, compared with the JVM.
  # Not hosted in the app, so it runs without launching it; started by ios/scripts/check-full.
  DahliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The Core Text renderer is compared with the JVM's text in the parity test.
      - path: Sources/Engine/CoreTextRenderer.swift
      # The tour and rating rules are pure and unit-tested.
      - path: Sources/Model/Tour.swift
      - path: Sources/Model/ReviewPolicy.swift
      # The widget's day and choice rules (WP-10).
      - path: Shared/AppGroup.swift
      - path: Shared/WidgetData.swift
    dependencies:
      - framework: ../build/MandalaCore.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["-lc++"]
        CODE_SIGNING_ALLOWED: NO
  # The Pro purchase (WP-9) against the local StoreKit configuration with StoreKitTest. Hosted in the app, because
  # StoreKit needs an app around it; the purchase code is compiled in, so the tests need no access to the app module.
  DahliaStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoreTests
      - path: Sources/Model/ProStore.swift
      - path: Sources/Model/ProPolicy.swift
      - path: Shared/AppGroup.swift
      - path: Config/Dahlia.storekit
        buildPhase: resources
    dependencies:
      - target: Dahlia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Dahlia:
    build:
      targets:
        Dahlia: all
        DahliaTests: [test]
        DahliaStoreTests: [test]
    run:
      # Running from Xcode buys against the local configuration (3.99 €, Family Sharing); Debug > StoreKit > Manage
      # Transactions refunds or approves Ask to Buy. Launch with -proOwned NO, or the debug build counts as Pro.
      storeKitConfiguration: Config/Dahlia.storekit
    test:
      targets:
        - DahliaTests
        - DahliaStoreTests
