# Dahlia for iPhone (PLAN-4). The Xcode project is generated from this file and not committed:
#   ios/Dahlia/scripts/generate     (or: xcodegen generate --spec ios/Dahlia/project.yml)
# Signing: copy Config/Signing.example.xcconfig to Config/Signing.xcconfig (ignored by Git).
name: Dahlia
options:
  bundleIdPrefix: one.tearoom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, de, es, fr, it, pt-BR, ru, ja, ko, zh-Hans]
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dahlia:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "*.md"
      - path: ../../android/app/src/main/assets/starter-favorites.json
        buildPhase: resources
    dependencies:
      # The Kotlin core, always the release (optimised) framework (SPIKE-3); built by scripts/build-core.
      - framework: ../build/MandalaCore.xcframework
        embed: false
    preBuildScripts:
      - name: Build the Kotlin core
        script: '"$SRCROOT/scripts/build-core"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait on the iPhone, like Android's phone layout; the iPad key only satisfies Xcode's check.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: $(DAHLIA_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Dahlia adds the pictures you save to your photo library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DAHLIA_APP_ICON)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
  # Parity test (PLAN-4 section 3.11): renders the fixtures through the framework, compared with the JVM.
  # Not hosted in the app, so it runs without launching it; started by ios/scripts/check-full.
  DahliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The Core Text renderer is compared with the JVM's text in the parity test.
      - path: Sources/Engine/CoreTextRenderer.swift
    dependencies:
      - framework: ../build/MandalaCore.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["-lc++"]
        CODE_SIGNING_ALLOWED: NO
schemes:
  Dahlia:
    build:
      targets:
        Dahlia: all
        DahliaTests: [test]
    test:
      targets:
        - DahliaTests
